spring.application.name=diacare
# Render injects PORT; locally the app keeps using 8085
server.port=${PORT:8085}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# Recycle connections before Neon drops them when its compute scales to zero
spring.datasource.hikari.max-lifetime=300000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Browser origins allowed to call the API (comma separated, no trailing slash)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Demo data: seeded once into an empty database. Hosted demos override the passwords.
app.demo.seed-enabled=${DEMO_SEED_ENABLED:true}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin@123}
app.demo.doctor-password=${DEMO_DOCTOR_PASSWORD:Doctor@123}
app.demo.patient-password=${DEMO_PATIENT_PASSWORD:Patient@123}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.enabled=true
