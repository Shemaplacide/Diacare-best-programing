# Render Blueprint for the DiaCare API (Spring Boot, Docker) on the Free plan.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: diacare-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: DiaCare
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://diacare-one.vercel.app
      - key: DB_POOL_SIZE
        value: "5"
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_DOCTOR_PASSWORD
        sync: false
      - key: DEMO_PATIENT_PASSWORD
        sync: false
